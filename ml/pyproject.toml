[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casttrace-ml"
version = "0.1.0"
description = "CastTrace AI ML Engine: Preprocessing, Quality Gates, Out-of-Distribution Guard, and Routing"
authors = [{ name = "CastTrace AI Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=9.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["casttrace_ml*"]
